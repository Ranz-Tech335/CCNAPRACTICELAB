  const miss=Q.log.filter(x=>!x.ok);
  m.innerHTML=`<div class="stack"><h2>${Q.score} of ${Q.log.length} correct (${pct(Q.score,Q.log.length)}%)</h2>
  <div class="card stack" style="gap:.5rem">${Object.entries(by).map(([id,v])=>`<div class="dbar"><span>${T(id).name}</span><div class="bar"><i style="width:${pct(v.c,v.a)}%"></i></div><span class="muted">${v.c}/${v.a}</span></div>`).join('')}</div>
  ${miss.length?`<h3 style="margin:0">Review what you missed</h3>${miss.map(x=>`<div class="card"><div class="qtext">${esc(x.q.q)}</div><p class="small" style="margin:.5rem 0 0"><span style="color:var(--bad)">Your answer: ${esc(x.q.options[x.pick])}</span><br><span style="color:var(--ok)">Correct: ${esc(x.q.options[x.q.answer])}</span><br><span class="muted">${esc(x.q.explain||'')}</span></p></div>`).join('')}`:''}
  <div class="row"><button class="btn pri" data-act="qagain">New round, same scope</button><button class="btn" data-act="qend">Change scope</button></div></div>`;
}

/* ---------- Exam ---------- */
let E=null;
function vExam(m){
  if(E&&!E.done)return eShow(m);
  if(E&&E.done)return eResult(m);
  m.innerHTML=`<div class="stack"><div><h2>Mock exam</h2><p class="muted" style="margin:.3rem 0 0">Questions follow the exam domain weights. No feedback until you finish. A practice target of 80% is a sensible aim.</p></div>
  <div class="card stack"><div class="row"><button class="btn pri" data-exam="20">Quick: 20 questions, 25 min</button><button class="btn pri" data-exam="60">Full: 60 questions, 75 min</button></div>
  <p class="small muted" style="margin:0">Domain weights: ${DOMAINS.map(d=>`${d.id}.0 ${d.weight}%`).join(', ')}.</p></div></div>`;
}
function eStart(n){
  const seen=new Set(),qs=[];let left=n;
  DOMAINS.forEach((d,i)=>{const c=i===DOMAINS.length-1?left:Math.round(n*d.weight/100);left-=c;const ts=TOPICS.filter(t=>t.dom===d.id);for(let k=0;k<c;k++)qs.push({q:makeQ(pick(ts),seen),sel:null,dom:d.id})});
  E={qs:shuffle(qs),i:0,end:Date.now()+(n===20?25:75)*60000,done:false};render();
}
function eShow(m){
  const x=E.qs[E.i],q=x.q,L='ABCD';
  m.innerHTML=`<div class="stack"><div class="row" style="justify-content:space-between"><span class="small muted">Question ${E.i+1} of ${E.qs.length}</span><span class="timer" id="etime"></span></div>
  <div class="row" style="gap:.3rem">${E.qs.map((y,i)=>`<button class="btn sm" data-go="${i}" style="padding:.1rem .45rem;min-width:2rem;${i===E.i?'border-color:var(--accent)':''}${y.sel!==null?';background:var(--accent-soft)':''}">${i+1}</button>`).join('')}</div>
  <div class="qtext">${esc(q.q)}</div>
  <div>${q.options.map((o,i)=>`<button class="opt ${x.sel===i?'sel':''}" data-eopt="${i}"><span class="k">${L[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
  <div class="row"><button class="btn" data-act="eprev" ${E.i===0?'disabled':''}>Previous</button><button class="btn" data-act="enext" ${E.i===E.qs.length-1?'disabled':''}>Next</button><button class="btn pri" data-act="efinish" style="margin-left:auto">Finish</button></div></div>`;
  const tick=()=>{const s=Math.max(0,Math.round((E.end-Date.now())/1000)),e=$('#etime');if(e)e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s<=0){clearTimers();eFinish()}};
  tick();clearTimers();timers.push(setInterval(tick,1000));
}
function eFinish(){clearTimers();E.done=true;render()}
function eResult(m){
  const by={};DOMAINS.forEach(d=>by[d.id]={a:0,c:0});
  E.qs.forEach(x=>{const b=by[x.dom];b.a++;const ok=x.sel===x.q.answer;if(ok)b.c++;if(x.sel!==null)rec(x.q.topic,ok)});
  const c=Object.values(by).reduce((s,v)=>s+v.c,0),p=pct(c,E.qs.length),miss=E.qs.filter(x=>x.sel!==x.q.answer);
  if(!E.saved){E.saved=1;const h=LS.get('exams',[]);h.unshift({t:Date.now(),p,n:E.qs.length});LS.set('exams',h.slice(0,10));Cloud.dirty()}
  m.innerHTML=`<div class="stack"><h2>${p}%: ${c} of ${E.qs.length}</h2>
  <p class="muted" style="margin:0">${p>=80?'Above the 80% practice target.':'Below the 80% practice target. Work on the weakest domains first.'}</p>
  <div class="card stack" style="gap:.5rem">${DOMAINS.map(d=>`<div class="dbar"><span>${d.id}.0 ${d.name}</span><div class="bar"><i style="width:${pct(by[d.id].c,by[d.id].a)}%;background:${pct(by[d.id].c,by[d.id].a)<70?'var(--bad)':'var(--ok)'}"></i></div><span class="muted">${by[d.id].c}/${by[d.id].a}</span></div>`).join('')}</div>
  <h3 style="margin:0">Review (${miss.length} wrong or skipped)</h3>
  ${miss.map(x=>`<div class="card"><span class="chip">${T(x.q.topic).name}</span><div class="qtext" style="margin-top:.4rem">${esc(x.q.q)}</div><p class="small" style="margin:.5rem 0 0"><span style="color:var(--bad)">${x.sel===null?'Skipped':'Your answer: '+esc(x.q.options[x.sel])}</span><br><span style="color:var(--ok)">Correct: ${esc(x.q.options[x.q.answer])}</span><br><span class="muted">${esc(x.q.explain||'')}</span></p></div>`).join('')}
  <div><button class="btn pri" data-act="eagain">Take another exam</button></div></div>`;
}

/* ---------- Labs ---------- */
let lab=null,hist=[],hidx=0,doneAll=false;
function vLabs(m){
  if(view.lab)return labView(m);
  const kinds=['switch','router'];
  m.innerHTML=`<div class="stack"><div><h2>Labs</h2><p class="muted" style="margin:.3rem 0 0">A simulated Cisco IOS command line. Every lab uses new addresses and VLANs each time, and your work is checked by what the device does, so any correct answer passes.</p></div>
  ${DOMAINS.map(d=>{const ls=LABS.filter(l=>l.dom===d.id);return ls.length?`<h3 style="margin:.4rem 0 0">${d.id}.0 ${d.name}</h3>`+ls.map(l=>`<button class="lab" data-lab="${l.id}"><span><b>${l.title}</b><br><span class="muted small">${l.blurb}</span></span><span class="pill">${l.kind}</span></button>`).join(''):''}).join('')}</div>`;
}
function topoSvg(t){
  const N=Object.fromEntries(t.nodes.map(n=>[n.id,n]));
  const ico=n=>{const{x,y}=n,c=n.you?' you':'';
    if(n.t==='pc')return`<rect class="nd${c}" x="${x-13}" y="${y-9}" width="26" height="17" rx="2"/><path class="lnk" d="M${x-6} ${y+14}h12M${x} ${y+8}v6"/>`;
    if(n.t==='switch')return`<rect class="nd${c}" x="${x-16}" y="${y-8}" width="32" height="16" rx="2"/><path class="lnk" d="M${x-9} ${y-2}h14m-3-3l3 3-3 3M${x+9} ${y+3}h-14m3-3l-3 3 3 3"/>`;
    if(n.t==='router')return`<circle class="nd${c}" cx="${x}" cy="${y}" r="13"/><path class="lnk" d="M${x-7} ${y}h14M${x} ${y-7}v14"/>`;
    return`<ellipse class="nd" cx="${x}" cy="${y}" rx="22" ry="12"/>`};
  const lines=t.links.map(l=>{const a=N[l.a],b=N[l.b];if(!a||!b)return'';const at=(f)=>[a.x+(b.x-a.x)*f,a.y+(b.y-a.y)*f-4];const p=at(.3),q=at(.7);
    return`<line class="lnk" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>${l.la?`<text class="ifl" x="${p[0]}" y="${p[1]}" text-anchor="middle">${l.la.replace('GigabitEthernet','Gi').replace('FastEthernet','Fa')}</text>`:''}${l.lb?`<text class="ifl" x="${q[0]}" y="${q[1]}" text-anchor="middle">${l.lb.replace('GigabitEthernet','Gi').replace('FastEthernet','Fa')}</text>`:''}`}).join('');
  const nodes=t.nodes.map(n=>`${ico(n)}<text x="${n.x}" y="${n.y+(n.t==='cloud'?3:25)}" text-anchor="middle" ${n.t==='cloud'?'style="font-size:6.5px"':''}>${esc(n.l)}</text>`).join('');
  return`<svg class="topo" viewBox="0 0 320 170" role="img" aria-label="Lab topology">${lines}${nodes}</svg>`;
}
function openLab(id){lab=newLab(id);hist=[];hidx=0;doneAll=false;setTab('labs',{lab:id})}
function labView(m){
  const L=LABS.find(l=>l.id===view.lab);
  m.innerHTML=`<div class="stack"><div class="row"><button class="btn sm" data-act="labback">&larr; Labs</button><span class="pill">${lab.kind}</span><span class="chip">${L.refs.map(r=>T(r)?T(r).name:r).join(', ')}</span></div>
  <h2>${lab.title}</h2><p style="margin:0" class="notes-p">${lab.brief}</p>
  ${topoSvg(lab.topo)}
  ${lab.note?`<p class="small muted" style="margin:0">${lab.note}</p>`:''}
  <ul class="tasks" id="tasks"></ul>
  <div class="term"><div class="term-out" id="tout" aria-live="polite"></div>
  <div class="term-in"><span class="pr" id="tpr"></span><input id="tin" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="IOS command"></div>
  <div class="keys">${['Tab','?','Up','en','conf t','exit','end','sh run'].map(k=>`<button data-key="${k}">${k==='Up'?'&uarr;':k}</button>`).join('')}</div></div>
  <div class="row"><button class="btn" data-act="labreset">Restart (same numbers)</button><button class="btn" data-act="labnew">New numbers</button><button class="btn" data-act="tclear">Clear screen</button></div>
  <p class="small muted">Tips: type <code>?</code> after a word for help. Tab completes. You can shorten commands (<code>conf t</code>, <code>sh ip int br</code>). Start with <code>enable</code> then <code>configure terminal</code>. Use "Show answer" on a task if you are stuck.</p></div>`;
  tasksRender();termInit();
}
function tasksRender(){
  let n=0;
  $('#tasks').innerHTML=lab.tasks.map((t,i)=>{let ok=false;try{ok=!!t.check(lab.dev)}catch(e){}if(ok)n++;
    return`<li class="${ok?'done':''}"><span class="led"></span><span>${t.text}${t.note?`<br><span class="small muted">${t.note}</span>`:''}</span><button class="btn sm" data-sol="${i}">Show answer</button>${lab.shown&&lab.shown[i]?`<pre class="sol">${['enable','configure terminal',...t.cmds].map(esc).join('\n')}</pre>`:''}</li>`}).join('');
  if(n===lab.tasks.length&&!doneAll){doneAll=true;toast('Lab complete. Every task passes.');termOut(`<span class="p">All tasks complete.</span>\n`)}
  if(n<lab.tasks.length)doneAll=false;
}
function termOut(h){const o=$('#tout');if(!o)return;o.insertAdjacentHTML('beforeend',h);o.scrollTop=o.scrollHeight}
function termInit(){
  const o=$('#tout');o.innerHTML='';termOut(`<span class="d">Simulated IOS. Press Enter to start. Type ? for help.</span>\n`);
  setPrompt();
  const inp=$('#tin');
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();runCmd(inp.value);inp.value=''}
    else if(e.key==='Tab'){e.preventDefault();inp.value=complete(lab.dev,inp.value)}
    else if(e.key==='ArrowUp'){e.preventDefault();histMove(-1)}
    else if(e.key==='ArrowDown'){e.preventDefault();histMove(1)}
    else if(e.key==='?'){e.preventDefault();showHelp()}
  });
  inp.addEventListener('input',()=>{if(inp.value.endsWith('?')){inp.value=inp.value.slice(0,-1);showHelp()}});
}
const setPrompt=()=>{const p=$('#tpr');if(p)p.textContent=prompt(lab.dev)};
function showHelp(){const inp=$('#tin'),v=inp.value;termOut(`<span class="p">${esc(prompt(lab.dev))}</span>${esc(v)}?\n${esc(help(lab.dev,v))}\n`)}
function histMove(d){const inp=$('#tin');if(!hist.length)return;hidx=Math.max(0,Math.min(hist.length,hidx+d));inp.value=hist[hidx]||''}
function runCmd(raw){
  const d=lab.dev,pr=prompt(d);
  termOut(`<span class="p">${esc(pr)}</span>${esc(raw)}\n`);
  if(raw.trim()){hist.push(raw);hidx=hist.length}
  if(/^\s*(clear|cls)\s*$/i.test(raw)){$('#tout').innerHTML='';return}
  let res='';try{res=exec(d,raw)}catch(e){res='% Internal error: '+e.message}
  if(res)termOut(/^\s*\^/.test(res)||/^%/.test(res)?`<span class="e">${esc(res)}</span>\n`:`${esc(res)}\n`);
  setPrompt();tasksRender();
}
const KEYRUN={'en':'enable','conf t':'configure terminal','exit':'exit','end':'end','sh run':'show running-config'};

/* ---------- Tools ---------- */
function vTools(m){m.innerHTML=toolsHtml();toolsInit()}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const g=s=>e.target.closest(s);let x;
  if(x=g('[data-tab]'))return setTab(x.dataset.tab);
  if(x=g('details.dom>summary')){view.open=+x.parentNode.dataset.dom;return}
  if(x=g('[data-topic]'))return setTab('learn',{topic:x.dataset.topic,open:view.open});
  if(x=g('[data-quiz]'))return setTab('quiz',{scope:x.dataset.quiz});
  if(x=g('[data-lab]'))return openLab(x.dataset.lab);
  if(x=g('[data-opt]')){if(Q.ans!==null)return;const i=+x.dataset.opt,ok=i===Q.cur.answer;Q.ans=i;if(ok)Q.score++;rec(Q.cur.topic,ok);Q.log.push({q:Q.cur,topic:Q.cur.topic,ok,pick:i});return render()}
  if(x=g('[data-eopt]')){E.qs[E.i].sel=+x.dataset.eopt;return render()}
  if(x=g('[data-go]')){E.i=+x.dataset.go;return render()}
  if(x=g('[data-exam]'))return eStart(+x.dataset.exam);
  if(x=g('[data-sol]')){lab.shown=lab.shown||{};lab.shown[x.dataset.sol]=!lab.shown[x.dataset.sol];return tasksRender()}
  if(x=g('[data-key]')){const k=x.dataset.key,inp=$('#tin');
    if(k==='Tab')inp.value=complete(lab.dev,inp.value);else if(k==='?')showHelp();else if(k==='Up')histMove(-1);else{runCmd(KEYRUN[k]);inp.value=''}
    return inp.focus()}
  if(x=g('[data-act]')){const a=x.dataset.act;
    if(a==='acctback'){acctOpen=false;return render()}
    if(a==='acctsync'){Cloud.msg='Syncing...';vAcct($('#main'));return Cloud.pull().then(()=>vAcct($('#main')))}
    if(a==='acctout')return Cloud.signOut();
    if(a==='acctnew')return Cloud.signIn($('#aem').value.trim(),$('#apw').value,true);
    if(a==='back')return setTab('learn',{open:view.open});
    if(a==='newex')return render();
    if(a==='qstart')return qStart($('#qscope').value,+$('#qn').value);
    if(a==='qnext'){Q.i++;if(Q.i>=Q.n){Q.done=true}else qNext();return render()}
    if(a==='qquit'){Q.done=Q.log.length>0;if(!Q.done)Q=null;return render()}
    if(a==='qagain')return qStart(Q.scope,Q.n);
    if(a==='qend'){Q=null;return render()}
    if(a==='eprev'){E.i--;return render()}
    if(a==='enext'){E.i++;return render()}
    if(a==='efinish')return eFinish();
    if(a==='eagain'){E=null;return render()}
    if(a==='labback')return setTab('labs');
    if(a==='labreset'){lab.dev=lab.build();hist=[];doneAll=false;return render()}
    if(a==='labnew'){return openLab(view.lab)}
    if(a==='tclear'){$('#tout').innerHTML='';return}
  }
});
document.addEventListener('submit',e=>{if(e.target.id==='acctform'){e.preventDefault();Cloud.signIn($('#aem').value.trim(),$('#apw').value,false)}});
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#tools'))toolsRun(e.target)});

/* Theme toggle and boot */
function theme(){const r=document.documentElement,c=r.dataset.theme;const n=c==='dark'?'light':c==='light'?'':'dark';if(n)r.dataset.theme=n;else delete r.dataset.theme;LS.set('theme',n);$('#theme').textContent=n==='dark'?'Dark':n==='light'?'Light':'Auto'}
(function boot(){
  const th=LS.get('theme','');if(th)document.documentElement.dataset.theme=th;
  $('#theme').textContent=th==='dark'?'Dark':th==='light'?'Light':'Auto';
  $('#theme').onclick=theme;
  $('#acct').onclick=()=>{acctOpen=true;render()};
  tab=LS.get('tab','learn');if(tab==='labs'||!TABS.some(t=>t[0]===tab))tab='learn';
  render();Cloud.init();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&!window.__ARTIFACT__){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
})();
</script>
